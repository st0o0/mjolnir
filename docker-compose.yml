services:
  mjolnir:
    image: ghcr.io/st0o0/mjolnir:latest
    # build: .
    container_name: mjolnir
    restart: unless-stopped
    ports:
      - "3493:3493"
      - "9550:9550"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      NUT_UPS_1_NAME: ecoflow
      NUT_UPS_1_DRIVER: usbhid-ups
      NUT_UPS_1_PORT: auto
      NUT_UPS_1_DESC: "EcoFlow Delta"
      NUT_MAXAGE: "25"
      # Single-user mode (legacy, simple):
      #   NUT_USER: admin
      # Multi-user mode:
      NUT_USER_1_NAME: monitor
      NUT_USER_1_UPSMON: primary
      NUT_USER_2_NAME: admin
      NUT_USER_2_ACTIONS: SET,FSD
      NUT_USER_2_INSTCMDS: ALL
    secrets:
      - nut-user-1-password
      - nut-user-2-password
    # Optional: mount custom configs (ENV overrides still apply)
    # volumes:
    #   - ./configs/ups.conf:/etc/nut/local/ups.conf:ro
    #   - ./configs/upsd.conf:/etc/nut/local/upsd.conf:ro
    #   - ./configs/upsd.users:/etc/nut/local/upsd.users:ro
    #   - ./configs/upsmon.conf:/etc/nut/local/upsmon.conf:ro

secrets:
  nut-user-1-password:
    file: .secrets/nut-user-1-password
  nut-user-2-password:
    file: .secrets/nut-user-2-password
